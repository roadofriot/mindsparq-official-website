    <!-- Structured Data (JSON-LD) for Local Business & Educational Organization SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "MindSparQ Education & Technology",
      "alternateName": "MindSparQ",
      "url": "https://mindsparqeducation.com.np",
      "logo": "https://mindsparqeducation.com.np/favicon.svg",
      "description": "Premier STEAM, Robotics, AI Coding, Abacus Mental Math, and Vedic Mathematics education center in Butwal, Rupandehi, Nepal.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Opposite Kalika Manavgyan Secondary School, Kalikanagar",
        "addressLocality": "Butwal",
        "addressRegion": "Lumbini Province",
        "postalCode": "32907",
        "addressCountry": "NP"
      },
      "telephone": ["+977-9857058666", "+977-9703606381"],
      "email": "contact@mindsparqeducation.com.np",
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "27.6866",
        "longitude": "83.4667"
      },
      "sameAs": [
        "https://www.facebook.com/mindsparqeducation",
        "https://mindsparqeducation.com.np"
      ]
    }
    </script>

    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('mindsparq-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = storedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
